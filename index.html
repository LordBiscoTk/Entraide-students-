2) Paste the Firebase settings (Project settings > Your apps > Web) in SETTINGS.

   allow create: if request.auth!=null && request.resource.data.by==request.auth.uid && request.resource.data.status=='open';
   allow update: if request.auth!=null && resource.data.by==request.auth.uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','solvedAt']);
   allow delete: if request.auth!=null && (resource.data.by==request.auth.uid || adm()); }
 match /threads/{t} { allow read: if request.auth!=null && (resource.data.asker==request.auth.uid || resource.data.helper==request.auth.uid);
   allow create: if request.auth!=null && request.resource.data.helper==request.auth.uid && request.resource.data.asker!=request.auth.uid;
   allow update: if request.auth!=null && ((resource.data.asker==request.auth.uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status'])) || (resource.data.helper==request.auth.uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['paid'])));
   match /msgs/{m} { allow read, create: if request.auth!=null && (get(/databases/$(d)/documents/threads/$(t)).data.asker==request.auth.uid || get(/databases/$(d)/documents/threads/$(t)).data.helper==request.auth.uid); } }
 match /coef/{k} { allow read: if request.auth!=null; allow create: if request.auth!=null && request.resource.data.by==request.auth.uid; allow update,delete: if adm(); }
 match /coefvotes/{v} { allow read: if request.auth!=null; allow create: if request.auth!=null && request.resource.data.uid==request.auth.uid && v==request.resource.data.key+'__'+request.auth.uid; }
 match /friends/{f} { allow read: if request.auth!=null && (resource.data.a==request.auth.uid || resource.data.b==request.auth.uid);
   allow create: if request.auth!=null && request.resource.data.by==request.auth.uid && request.resource.data.status=='pending' && (request.resource.data.a==request.auth.uid || request.resource.data.b==request.auth.uid);
   allow update: if request.auth!=null && resource.data.by!=request.auth.uid && (resource.data.a==request.auth.uid || resource.data.b==request.auth.uid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status']) && request.resource.data.status=='ok';
   allow delete: if request.auth!=null && (resource.data.a==request.auth.uid || resource.data.b==request.auth.uid);
   match /msgs/{m} { allow read, create: if request.auth!=null && get(/databases/$(d)/documents/friends/$(f)).data.status=='ok' && (get(/databases/$(d)/documents/friends/$(f)).data.a==request.auth.uid || get(/databases/$(d)/documents/friends/$(f)).data.b==request.auth.uid); } }

4) Make an administrator: create your own account in the app, then in Firestore add a document in the collection "admins" whose ID is your account's UID (Authentication > Users). The document can be empty.
5) Upload index.html AND sw.js (a tiny file you never edit; it makes the app open offline) to GitHub Pages. Students open the link and choose "Add to Home Screen". Keep the same link forever, so students stay logged in.
6) AI (also needed to read photos of past papers): get a free key in Google AI Studio and paste it in testKey. Then in Google Cloud Console > APIs and Services > Credentials > your key > Application restrictions > Websites, add your site address, so the key works only from your app. Do not enable billing, so the free limit cannot turn into a charge.
Updates: replace index.html only, and raise APP_VERSION by one so students see "A new version is ready".
Forgotten password: students use their recovery code (shown once at sign-up and after each password change).
Optional extras that need a server, not in this file: notifications when the app is closed, administrator password reset (optional/helper-worker.js).

 const d=document.createElement('div'),t=cfgApp.times||2;d.id='tk';d.setAttribute('role','status');d.innerHTML='<span>Study hint: '+esc(tp[tipI++%tp.length])+'</span>';d.firstChild.style.animationIterationCount=t;d.firstChild.onanimationend=()=>d.remove();setTimeout(()=>d.remove(),(t*14+2)*1000);document.body.appendChild(d)},15000);
window.openReport=id=>{rp=id?users.find(u=>u.id==id):S;tab='report';draw()};
window.closeReport=()=>{tab=rp&&rp!==S?'admin':'stats';rp=null;draw()};
function vReport(){const u=rp||S,p=u.profile||{},sub=u.sub||[],nt=u.notes||[];
 return`<h1>Progress report</h1><p>${esc(p.name||p.username||'')}, ${esc(p.level||'')}<br>Date: ${today()}</p><div class="c">Study time this week: ${fm(wm(u))}<br>Points this week: ${(u.pts||{})[wk()]||0}${u===S?'<br>Current streak: '+streak()+' days':''}</div><h2>Subjects</h2>`+sub.map(s=>{const d=s.tp.filter(x=>x.s==2).length;return`<div class="c"><b>${esc(s.n)}</b>: ${d} of ${s.tp.length} topics done<div class="bar"><i style="width:${s.tp.length?d/s.tp.length*100:0}%"></i></div></div>`}).join('')+`<h2>Open weak points and assignments</h2>`+(nt.filter(x=>!x.d).map(x=>`<div class="c">${esc(x.t)} <span class="m">(${esc(x.j)}${x.due?', due '+esc(x.due):''})</span></div>`).join('')||'<p class="m">None</p>')+`<div class="r"><button onclick="window.print()">Print or save as PDF</button><button class="g" onclick="closeReport()">Back</button></div>`}
function adminExtra(){const c=cfgApp||{};return`<div class="c"><b>Exams and hints</b><label class="m">GCE date<input class="w" type="date" id="cg" value="${esc(c.gce||'')}"></label><label class="m">Next sequence exam name<input class="w" id="cn" value="${esc(c.seqName||'')}"></label><label class="m">Next sequence exam date<input class="w" type="date" id="cs" value="${esc(c.seq||'')}"></label><label class="m">Show a hint every (minutes)<input class="w" type="number" id="ce" value="${c.every||30}"></label><label class="m">Times the hint scrolls<input class="w" type="number" id="ct" value="${c.times||2}"></label><label class="m">Study hints, one per line<textarea id="cp" rows="5">${esc((c.tips||[]).join('\n'))}</textarea></label><button onclick="saveCfg()">Save</button></div>`+(pend.length?`<h2>Papers waiting for approval</h2>`+pend.map(p=>`<div class="c"><b>${esc(p.subject)} ${esc(p.session)} ${esc(p.year)}</b> <span class="m">${esc(p.level)}, ${p.questions.length} questions</span><div class="m">${esc(((p.questions[0]||{}).text||'').slice(0,160))}</div><div class="r"><button onclick="paperOk('${p.id}',1)">Approve</button><button class="g" onclick="paperOk('${p.id}',0)">Delete</button></div></div>`).join(''):'')}
window.saveCfg=async()=>{const c={gce:$('cg'),seqName:$('cn'),seq:$('cs'),every:+$('ce')||30,times:+$('ct')||2,tips:$('cp').split('\n').map(x=>x.trim()).filter(Boolean)};try{await setDoc(doc(db,'config','app'),c);cfgApp=c;alert('Saved.')}catch(e){alert('Could not save.')}};
window.helpTpl=()=>{const u=users.find(x=>x.id==msgTo),n=u?((u.profile||{}).name||(u.profile||{}).username):'';document.getElementById('mx').value=(n?'Hello '+n+', ':'Hello, ')+'could you kindly help us by taking a clear photo of any past GCE paper and adding it in the Papers tab? Thank you.'};
window.paperOk=async(id,ok)=>{try{if(ok)await setDoc(doc(db,'papers',id),{status:'approved'},{merge:true});else await deleteDoc(doc(db,'papers',id));pend=pend.filter(p=>p.id!=id);draw()}catch(e){alert('Could not update.')}};
async function loadPapers(){try{papers=(await getDocs(query(collection(db,'papers'),where('status','==','approved')))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}draw()}
function vPapers(){let h=`<h1>Past papers</h1><div class="c"><b>Find questions</b><input class="w" id="pq" placeholder="For example: June 2020 physics, or circular motion" style="margin-top:8px"><button onclick="findP()">Search</button></div>`;
 if(found)h+=found.length?found.map(p=>`<div class="c"><b>${esc(p.subject)}, ${esc(p.session)} ${esc(p.year)}</b> <span class="m">${esc(p.level)}</span>`+p.qs.map(q=>`<div class="t"><span>${esc(q.no||'')} ${esc(q.text)}</span></div>`).join('')+'</div>').join(''):'<p class="m">Nothing found yet. Help us by adding a paper below.</p>';
 h+=`<h2>Add a paper</h2><div class="c"><p class="m">Take clear photos of every page in good light. The AI reads them, then you check the text before sending. An administrator approves it before others can see it.</p><div class="r"><input class="w" id="ps" placeholder="Subject"><input class="w" id="py" placeholder="Year, for example 2020"><select id="pn"><option>June</option><option>November</option><option>Other</option></select><select id="pl"><option>Ordinary Level</option><option>Advanced Level</option></select></div><input type="file" id="pf" accept="image/*" multiple><button onclick="readP()">Read the photos</button></div>`;
 if(draft)h+=draft.wait?'<p class="m">Reading the pages...</p>':draft.err?'<div class="warn">Could not read the photos. Try clearer pictures.</div>':`<div class="c"><b>Check the text</b><textarea id="pt" rows="12">${esc(draft.qs.map(q=>(q.no||'')+' '+q.text).join('\n\n'))}</textarea><button onclick="sendP()">Send for approval</button></div>`;return h}
window.findP=()=>{const t=$('pq').toLowerCase().split(/\s+/).filter(Boolean);found=[];papers.forEach(p=>{const hd=(p.subject+' '+p.session+' '+p.year+' '+p.level).toLowerCase(),hit=t.every(w=>hd.includes(w))?p.questions:p.questions.filter(q=>t.every(w=>(hd+' '+q.text).toLowerCase().includes(w)));if(t.length&&hit.length)found.push({...p,qs:hit})});draw()};
const shrink=f=>new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7).split(',')[1])};i.onerror=rej;i.src=u});
window.readP=async()=>{const fs=[...document.getElementById('pf').files].slice(0,8),meta={subject:$('ps'),year:$('py'),session:$('pn'),level:$('pl')};if(!fs.length||!meta.subject||!meta.year)return alert('Add the subject, the year and at least one photo.');draft={wait:1};draw();
 try{const o=pj(await aiCall('These photos are pages of a school examination paper. Read all the questions, even if the paper is not clean or the photo is tilted. Keep the original wording. Reply ONLY JSON: {"qs":[{"no":"question number","text":"full question text"}]}',await Promise.all(fs.map(shrink))));if(!o.qs||!o.qs.length)throw 0;draft={meta,qs:o.qs}}catch(e){draft={err:1}}draw()};
window.sendP=async()=>{const t=$('pt');if(!t||!draft||!draft.meta)return;const qs=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>({no:'',text:x}));try{await addDoc(collection(db,'papers'),{...draft.meta,questions:qs,by:uid,status:isAdm?'approved':'pending',at:Date.now()});draft=null;alert('Thank you. An administrator will check it.');draw()}catch(e){alert('Could not send. Check your connection.')}};
try{const m={name:'StudyPlan',short_name:'StudyPlan',start_url:location.href.split('#')[0],display:'standalone',background_color:'#F3F5F4',theme_color:'#4f46e5',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4f46e5"/><path d="M25 52l17 17 34-38" fill="none" stroke="#2ec4a6" stroke-width="12" stroke-linecap="round"/></svg>'),sizes:'any',type:'image/svg+xml'}]},l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
draw();
</script></body></html>
