<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Entraide Étudiants</title>
<style>
:root{--t:#0F6B5C;--ink:#10231F;--mu:#4A5E59;--bg:#F3F6F5;--card:#fff;--ln:#DCE5E2;--on:#fff;--pat:linear-gradient(transparent,transparent);color-scheme:light}
:root[data-dark]{--ink:#EAF2EF;--mu:#A9BDB7;--bg:#0C1513;--card:#15221F;--ln:#2A3B37;--on:#0A0F14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--pat),var(--bg);min-height:100vh;padding-top:env(safe-area-inset-top)}
#app{max-width:480px;margin:0 auto}
main{padding:20px 20px 100px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 8px}p{margin:0}
.mu{color:var(--mu);font-size:13px}
button,input,select{font-family:inherit}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--t);color:var(--on);font-weight:700;font-size:15px;cursor:pointer}
.btn.o{background:var(--card);color:var(--t);border:1.5px solid var(--t)}
.btn.w{width:100%;margin-top:6px}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
input,select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:0 14px;font-size:15px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--t);color:var(--on);border-color:var(--t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;background:#FDF0D0;color:#10231F;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--ln)}.bar i{display:block;height:8px;border-radius:4px;background:var(--t)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;text-align:center}
.sc span{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--t)}
.opt{display:block;width:100%;min-height:56px;margin:8px 0;padding:0 14px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--ink);font-size:16px;text-align:left;cursor:pointer}
.opt.ok{border-color:var(--t)}.opt.ko{border-color:#C0392B}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--ln);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:52px;justify-content:center;color:var(--mu);font-size:11px;font-weight:700;text-decoration:none}
nav a.on{color:var(--t)}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.4;white-space:pre-wrap;background:var(--card);border:1px solid var(--ln)}
.bub small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
.me{margin-left:auto;background:var(--t);color:var(--on);border-color:var(--t)}.me small{color:var(--on)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--ln)}
.sw[aria-pressed=true]{border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90%}
.rk{display:flex;align-items:center;gap:12px;min-height:52px}.rk b:first-child{width:24px;color:var(--mu)}
.lnk{background:none;border:0;color:var(--t);font-weight:700;font-size:14px;min-height:44px;cursor:pointer;text-decoration:underline}
</style></head><body>
<div id="app"><main id="v"></main></div><nav id="nav"></nav><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>

const SB_URL="https://rtamburblynnsolobuun.supabase.co",SB_KEY="sb_publishable_q-9H-yJGz3yJwC3DAhKeEQ_TjfyqHsU";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={},ls={get(k,d){try{const v=localStorage.getItem("ee_"+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem("ee_"+k,JSON.stringify(v))}catch(e){}}};
const C=[["Vert","#0F6B5C","#3CC4AB"],["Bleu","#1F5FBF","#6AA3FF"],["Violet","#6B3FB5","#B596F5"],["Orange","#B4531A","#F2955A"],["Rose","#B22A69","#F277AE"]];
const INT=["Basket","Football","Animés","Musique","Technologie","Jeux vidéo","Cinéma","Lecture","Cuisine","Voyages","Mode","Sciences","Dessin","Entrepreneuriat"];
const PAT={Basket:"repeating-radial-gradient(circle at 80% 15%,rgba(242,134,40,.22) 0 2px,transparent 2px 36px)",Football:"repeating-linear-gradient(0deg,rgba(40,160,70,.18) 0 44px,transparent 44px 88px)",Animés:"radial-gradient(circle at 20% 20%,rgba(140,90,220,.25) 0 3px,transparent 4px) 0 0/48px 48px",Musique:"repeating-linear-gradient(135deg,rgba(230,80,140,.16) 0 6px,transparent 6px 22px)",Technologie:"linear-gradient(rgba(20,170,150,.18) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(20,170,150,.18) 1px,transparent 1px) 0 0/28px 28px"};
const QZ={"Analyse 1":[["Dérivée de x² ?","2x",["x","x²","2"]],["Limite de 1/x quand x tend vers +∞ ?","0",["1","+∞","−1"]],["Dérivée de sin(x) ?","cos(x)",["−cos(x)","sin(x)","−sin(x)"]],["Primitive de 2x ?","x² + C",["2x² + C","x + C","2 + C"]]],"Physique":[["Unité de la force ?","Le newton",["Le joule","Le watt","Le pascal"]],["Deuxième loi de Newton : F = ?","m × a",["m / a","m + a","a / m"]],["Vitesse moyenne = ?","distance / temps",["temps / distance","distance × temps","distance + temps"]],["Accélération de la pesanteur sur Terre ≈ ?","9,8 m/s²",["1,6 m/s²","3,7 m/s²","24 m/s²"]]],"Anglais":[["She ___ to school every day.","goes",["go","going","gone"]],["Passé de « to buy » ?","bought",["buyed","boughten","buy"]],["I have lived here ___ 2020.","since",["for","from","during"]],["Pluriel de « child » ?","children",["childs","childes","childrens"]]]};
const IC={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",cal:"M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4",quiz:"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z",msg:"M4 5h16v11H9l-5 4z",user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6",ai:"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z",cup:"M7 4h10v5a5 5 0 0 1-10 0z M4 5h3v3a3 3 0 0 1-3-3z M20 5h-3v3a3 3 0 0 0 3-3z M12 14v4 M8 20h8"};
const svg=p=>'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+p+'"/></svg>';
const NAV=[["accueil","Accueil",IC.home],["agenda","Agenda",IC.cal],["quiz","Quiz",IC.quiz],["messages","Messages",IC.msg],["profil","Profil",IC.user]];
const S=Object.assign({nick:"",int:[],c:0,dark:matchMedia("(prefers-color-scheme: dark)").matches},ls.get("t",{}));
let R="accueil",Q=null,me=null,P=null,MS=[],authMode="in",sb=null;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=e=>(e.date===iso(new Date())?"Aujourd’hui":new Date(e.date+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))+(e.time?" · "+e.time.slice(0,5):"");
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)}
const FR={"Invalid login credentials":"E-mail ou mot de passe incorrect.","User already registered":"Cet e-mail est déjà utilisé.","Email not confirmed":"Confirme d’abord ton e-mail.","Password should be at least 6 characters":"Le mot de passe doit avoir au moins 6 caractères."};
const msgErr=e=>{const m=(e&&e.message)||"Erreur inconnue";for(const k in FR)if(m.indexOf(k)===0)return FR[k];return m};
async function q(p){try{const r=await p;if(r.error){toast(msgErr(r.error));return null}return r.data||[]}catch(e){toast("Connexion impossible. Vérifie ta connexion internet.");return null}}
function theme(){const r=document.documentElement,d=!!S.dark,p=C[S.c||0];d?r.setAttribute("data-dark",""):r.removeAttribute("data-dark");r.style.setProperty("--t",d?p[2]:p[1]);r.style.setProperty("--on",d?"#0A0F14":"#fff");const k=(S.int||[]).find(x=>PAT[x]);r.style.setProperty("--pat",k?PAT[k]:"linear-gradient(transparent,transparent)")}
async function saveProfile(){ls.set("t",{dark:S.dark,c:S.c});if(!me)return;const r=await sb.from("profiles").update({nick:(S.nick||"Étudiant").slice(0,24),interests:S.int,color:S.c,dark:S.dark}).eq("id",me.id);if(r.error)toast("Réglages non enregistrés : "+msgErr(r.error))}
async function setUser(u){me=u||null;P=null;if(me){const d=await q(sb.from("profiles").select("*").eq("id",me.id));P=d&&d[0]||null;if(P){S.nick=P.nick;S.int=P.interests||[];S.c=P.color||0;S.dark=!!P.dark}
  sb.removeAllChannels();sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>{if(R==="messages")loadMsgs()}).subscribe()}
  render()}
const sc=(h,l,p)=>'<a class="sc" href="'+h+'"><span>'+svg(p)+'</span>'+l+'</a>';
const chips=()=>'<div class="chips">'+INT.map(t=>'<button class="chip" data-act="int" data-v="'+t+'" aria-pressed="'+S.int.includes(t)+'">'+t+'</button>').join("")+'</div>';
const pals=()=>'<div class="row">'+C.map((c,i)=>'<button class="sw" data-act="col" data-v="'+i+'" aria-label="'+c[0]+'" aria-pressed="'+(S.c===i)+'" style="background:'+(S.dark?c[2]:c[1])+'"></button>').join("")+'</div>';
const darkRow=()=>'<div class="row sp card"><b>Mode sombre</b><button class="chip" data-act="dark" aria-pressed="'+!!S.dark+'">'+(S.dark?"Activé":"Désactivé")+'</button></div>';
const V={};
V.auth=()=>{const up=authMode==="up";return '<h1>Entraide Étudiants</h1><p class="mu">Révise, partage tes cours et défie tes camarades.</p><div class="card"><b>'+(up?"Créer un compte":"Se connecter")+'</b>'+(up?'<label class="mu" for="an">Pseudo (visible par les autres)</label><input id="an" maxlength="24" autocomplete="nickname">':'')+'<label class="mu" for="ae">Adresse e-mail</label><input id="ae" type="email" autocomplete="email"><label class="mu" for="ap">Mot de passe (6 caractères minimum)</label><input id="ap" type="password" autocomplete="'+(up?"new-password":"current-password")+'" data-enter="auth"><button class="btn w" data-act="auth">'+(up?"Créer mon compte":"Me connecter")+'</button></div><button class="lnk" data-act="mode">'+(up?"J’ai déjà un compte":"Je n’ai pas de compte : en créer un")+'</button>'};
V.onb=()=>'<h1>Bienvenue, '+esc(S.nick)+' !</h1><p class="mu">Personnalise ton application.</p><h2>Tes centres d’intérêt (3 minimum)</h2>'+chips()+'<h2>Ta couleur</h2>'+pals()+darkRow()+'<button class="btn w" data-act="start"'+(S.int.length<3?" disabled":"")+'>Commencer</button>';
V.accueil=()=>'<h1>Bonjour, '+esc(S.nick)+'</h1><p class="mu">Prêt à réviser aujourd’hui ?</p><a id="hero" href="#agenda" style="display:block;text-decoration:none;background:var(--t);color:var(--on);border-radius:16px;padding:16px;margin:14px 0"><div style="font-size:12px;font-weight:700;letter-spacing:.5px">PROCHAINE ÉCHÉANCE</div><div id="hv" style="font-size:18px;font-weight:700;margin:4px 0">Chargement…</div><div style="font-size:13px">Ouvrir l’agenda</div></a><div class="grid">'+sc("#quiz","Quiz",IC.quiz)+sc("#ia","Assistant IA",IC.ai)+sc("#classement","Classement",IC.cup)+sc("#profil","Inviter",IC.user)+'</div><h2>Partager un cours</h2><div class="card"><input id="ct" maxlength="120" placeholder="Titre (ex. Résumé d’Analyse 1)" aria-label="Titre du cours"><div style="height:8px"></div><input id="cs" maxlength="40" placeholder="Matière" aria-label="Matière"><button class="btn w" data-act="addc">Publier</button></div><h2>Récemment partagé</h2><div id="cl"><p class="mu">Chargement…</p></div>';
async function loadHome(){const t=iso(new Date());const e=await q(sb.from("events").select("title,date,time").gte("date",t).order("date").order("time").limit(1));const h=$("#hv");if(h)h.textContent=e&&e[0]?e[0].title+" · "+fmt(e[0]):"Aucun événement : ajoute-en un";
  const c=await q(sb.from("courses").select("id,user_id,title,subject,profiles(nick)").order("created_at",{ascending:false}).limit(30));const l=$("#cl");if(l&&c)l.innerHTML=c.length?c.map(x=>'<div class="card row sp"><div><span class="tag">'+esc(x.subject)+'</span><div style="font-weight:700;margin:6px 0">'+esc(x.title)+'</div><div class="mu">Partagé par '+esc(x.profiles&&x.profiles.nick||"un étudiant")+'</div></div>'+(x.user_id===me.id?'<button class="chip" data-act="delc" data-v="'+x.id+'">Supprimer</button>':'')+'</div>').join(""):'<p class="mu">Aucun cours partagé pour l’instant. Sois le premier !</p>'}
V.agenda=()=>'<h1>Agenda</h1><p class="mu">Tes révisions, quiz et rendus.</p><div class="card"><input id="et" maxlength="120" placeholder="Titre de l’événement" aria-label="Titre"><div class="row" style="margin:8px 0"><input id="ed" type="date" value="'+iso(new Date())+'" aria-label="Date"><input id="eh" type="time" value="14:00" aria-label="Heure"></div><select id="ey" aria-label="Type">'+["Révision","Quiz","Rendu","Examen","Entraide"].map(t=>"<option>"+t+"</option>").join("")+'</select><button class="btn w" data-act="adde">Ajouter</button></div><div id="el"><p class="mu">Chargement…</p></div>';
async function loadEv(){const a=await q(sb.from("events").select("*").order("date").order("time"));const l=$("#el");if(l&&a)l.innerHTML=a.length?a.map(e=>'<div class="card row sp"><div><span class="tag">'+esc(e.type)+'</span><div style="font-weight:700;margin:6px 0 2px">'+esc(e.title)+'</div><div class="mu">'+fmt(e)+'</div></div><button class="chip" data-act="dele" data-v="'+e.id+'">Supprimer</button></div>').join(""):'<p class="mu">Aucun événement. Ajoute ton premier rendez-vous.</p>'}
V.quiz=()=>{if(!Q)return '<div class="row sp"><h1>Quiz</h1><a href="#classement" class="chip" style="display:flex;align-items:center;text-decoration:none">Classement</a></div><p class="mu">Teste-toi sur tes cours révisés.</p><div class="card"><b>Tes aptitudes</b><div id="apt"><p class="mu">Chargement…</p></div></div><h2>Choisis un quiz</h2>'+Object.keys(QZ).map(s=>'<div class="card row sp"><div><b>'+s+'</b><div class="mu">'+QZ[s].length+' questions</div></div><button class="btn" data-act="qs" data-v="'+s+'">Commencer</button></div>').join("");
  const n=Q.qs.length;if(Q.done){return '<h1>Résultat</h1><div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800;color:var(--t)">'+Q.sc+'/'+n+'</div><b>+'+Q.sc*20+' points</b><div class="mu">'+Math.round(100*Q.sc/n)+' % en '+esc(Q.s)+'</div></div>'+(Q.miss.length?'<div class="card"><b>Points à revoir</b>'+Q.miss.map(m=>'<div class="mu" style="margin-top:6px">• '+esc(m)+'</div>').join("")+'</div>':'<p class="mu">Aucune erreur, bravo !</p>')+'<button class="btn w" data-act="qs" data-v="'+esc(Q.s)+'">Refaire le quiz</button><a class="btn o w" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="#classement">Voir le classement</a><button class="btn o w" data-act="shr">Partager mon score</button><button class="btn o w" data-act="qq">Retour</button>'}
  const x=Q.qs[Q.i];return '<div class="row sp mu"><span>Question '+(Q.i+1)+' sur '+n+'</span><span>'+esc(Q.s)+'</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:'+(100*Q.i/n)+'%"></i></div><div class="card"><b style="font-size:20px">'+esc(x.q)+'</b></div>'+x.o.map((t,i)=>'<button class="opt'+(Q.pick==null?"":t===x.ans?" ok":i===Q.pick?" ko":"")+'" data-act="qp" data-v="'+i+'">'+esc(t)+(Q.pick!=null&&t===x.ans?" ✓":"")+'</button>').join("")+(Q.pick!=null?'<button class="btn w" data-act="qn">'+(Q.i<n-1?"Suivant":"Voir mon résultat")+'</button>':'')+'<button class="chip" data-act="qq" style="margin-top:12px">Abandonner</button>'};
async function loadApt(){const d=await q(sb.from("scores").select("subject,correct,total").eq("user_id",me.id));const e=$("#apt");if(!e||!d)return;const b={};d.forEach(r=>{b[r.subject]=Math.max(b[r.subject]||0,Math.round(100*r.correct/r.total))});e.innerHTML=Object.keys(QZ).map(s=>'<div style="margin-top:10px"><div class="row sp mu"><span>'+s+'</span><span>'+(b[s]!=null?b[s]+" %":"pas encore testé")+'</span></div><div class="bar"><i style="width:'+(b[s]||0)+'%"></i></div></div>').join("")}
V.classement=()=>'<h1>Classement</h1><p class="mu">Les points de tous les étudiants (20 points par bonne réponse).</p><div id="lb"><p class="mu">Chargement…</p></div><a class="btn w" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="#quiz">Faire un quiz</a>';
async function loadLb(){const d=await q(sb.from("leaderboard").select("*").limit(50));const e=$("#lb");if(!e||!d)return;e.innerHTML=d.length?d.map((s,i)=>'<div class="card rk" style="'+(s.user_id===me.id?"border:2px solid var(--t)":"")+'"><b>'+(i+1)+'</b><span style="flex:1;font-weight:'+(s.user_id===me.id?800:600)+'">'+esc(s.nick)+(s.user_id===me.id?" (toi)":"")+'</span><b style="color:var(--t)">'+s.pts+' pts</b></div>').join(""):'<div class="card mu">Aucun score pour l’instant. Fais un quiz pour apparaître ici !</div>'}
V.messages=()=>'<h1>Messages</h1><p class="mu">Salon général : visible par tous les étudiants.</p><div id="ml" style="min-height:240px;margin:12px 0"></div><div class="row"><input id="mi" maxlength="500" placeholder="Écrire un message…" aria-label="Message" data-enter="sendm"><button class="btn" data-act="sendm">Envoyer</button></div>';
async function loadMsgs(){const d=await q(sb.from("messages").select("id,text,user_id,profiles(nick)").order("created_at",{ascending:false}).limit(60));if(d){MS=d.reverse();drawMsgs()}}
const drawMsgs=()=>{const e=$("#ml");if(!e)return;e.innerHTML=MS.length?MS.map(m=>'<div class="bub'+(m.user_id===me.id?" me":"")+'"><small>'+esc(m.profiles&&m.profiles.nick||"Étudiant")+'</small>'+esc(m.text)+'</div>').join(""):'<p class="mu">Aucun message. Dis bonjour !</p>';window.scrollTo(0,document.body.scrollHeight)};
V.ia=()=>'<h1>Assistant IA</h1><div class="card"><b>Bientôt disponible</b><p class="mu" style="margin-top:6px">L’assistant a besoin d’une clé d’API d’IA et d’une petite fonction serveur pour fonctionner en toute sécurité. Ce sera l’étape suivante.</p></div><a class="btn w" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="#accueil">Retour à l’accueil</a>';
V.profil=()=>{const l=location.href.split("#")[0];return '<h1>Mon profil</h1><div class="card"><label class="mu" for="nk">Pseudo (visible dans le classement et les messages)</label><input id="nk" maxlength="24" value="'+esc(S.nick)+'" data-chg="nick"><div class="mu" style="margin-top:6px">'+esc(me.email||"")+'</div></div><h2>Centres d’intérêt</h2>'+chips()+'<p class="mu" style="margin-top:6px">Le fond d’écran s’adapte à tes goûts (basket, football, animés, musique, technologie).</p><h2>Apparence</h2>'+pals()+darkRow()+'<h2>Inviter des amis</h2><div class="card"><div class="mu">Ton lien d’invitation</div><div style="word-break:break-all;font-weight:700;margin:4px 0 8px">'+esc(l)+'</div><div class="row"><button class="btn" data-act="copy">Copier</button><button class="btn o" data-act="shr2">Partager</button></div></div><button class="btn o w" data-act="out" style="margin-top:20px">Se déconnecter</button>'};
function render(){theme();const nav=$("#nav"),v=$("#v");
  if(!me){nav.style.display="none";v.innerHTML=V.auth();return}
  if(!P||(S.int||[]).length<3){nav.style.display="none";v.innerHTML=V.onb();return}
  nav.style.display="flex";const t={classement:"quiz",ia:"accueil"}[R]||R;nav.innerHTML=NAV.map(n=>'<a href="#'+n[0]+'"'+(n[0]===t?' class="on" aria-current="page"':"")+'>'+svg(n[2])+n[1]+'</a>').join("");
  v.innerHTML=V[R]();({accueil:loadHome,agenda:loadEv,quiz:()=>{if(!Q)loadApt()},classement:loadLb,messages:loadMsgs})[R]&&({accueil:loadHome,agenda:loadEv,quiz:()=>{if(!Q)loadApt()},classement:loadLb,messages:loadMsgs})[R]()}
function go(){const h=(location.hash||"#accueil").slice(1);R=(V[h]&&["auth","onb"].indexOf(h)<0)?h:"accueil";render();if(R!=="messages")window.scrollTo(0,0)}
const val=id=>($("#"+id)||{}).value||"";
const share=async(text)=>{const url=location.href.split("#")[0];try{if(navigator.share){await navigator.share({text,url});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(text+" "+url);toast("Lien copié !")}catch(e){prompt("Copie ce message :",text+" "+url)}};
const A={
  mode(){authMode=authMode==="in"?"up":"in";render()},
  async auth(){const em=val("ae").trim(),pw=val("ap");if(!em||!pw)return toast("Remplis l’e-mail et le mot de passe.");const b=$(".btn.w");b.disabled=true;
    if(authMode==="up"){const nick=val("an").trim().slice(0,24)||"Étudiant";const r=await sb.auth.signUp({email:em,password:pw,options:{data:{nick}}});b.disabled=false;if(r.error)return toast(msgErr(r.error));if(!r.data.session){toast("Compte créé. Confirme ton e-mail puis connecte-toi.");authMode="in";return render()}await setUser(r.data.user)}
    else{const r=await sb.auth.signInWithPassword({email:em,password:pw});b.disabled=false;if(r.error)return toast(msgErr(r.error));await setUser(r.data.user)}},
  async out(){await sb.auth.signOut();sb.removeAllChannels();me=null;P=null;Q=null;location.hash="";render()},
  int(v){S.int=S.int.includes(v)?S.int.filter(x=>x!==v):S.int.concat([v]);saveProfile();render()},
  col(v){S.c=+v;saveProfile();render()},dark(){S.dark=!S.dark;saveProfile();render()},
  start(){if(S.int.length<3)return;saveProfile();location.hash="#accueil";go()},
  async addc(){const t=val("ct").trim();if(!t)return toast("Donne un titre à ton cours.");const r=await sb.from("courses").insert({title:t,subject:val("cs").trim().slice(0,40)||"Cours"});if(r.error)return toast(msgErr(r.error));$("#ct").value="";$("#cs").value="";loadHome()},
  async delc(v){await q(sb.from("courses").delete().eq("id",v));loadHome()},
  async adde(){const t=val("et").trim();if(!t)return toast("Donne un titre à l’événement.");const r=await sb.from("events").insert({title:t,date:val("ed")||iso(new Date()),time:val("eh")||null,type:val("ey")});if(r.error)return toast(msgErr(r.error));$("#et").value="";loadEv()},
  async dele(v){await q(sb.from("events").delete().eq("id",v));loadEv()},
  qs(v){const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);Q={s:v,i:0,sc:0,pick:null,miss:[],qs:QZ[v].map(x=>({q:x[0],ans:x[1],o:sh([x[1]].concat(x[2]))}))};if(location.hash!=="#quiz")location.hash="#quiz";else render()},
  qp(v){if(Q.pick!=null)return;const x=Q.qs[Q.i];Q.pick=+v;if(x.o[Q.pick]===x.ans)Q.sc++;else Q.miss.push(x.q);render()},
  async qn(){if(Q.i<Q.qs.length-1){Q.i++;Q.pick=null;render()}else{Q.done=true;render();const r=await sb.from("scores").insert({subject:Q.s,correct:Q.sc,total:Q.qs.length});if(r.error)toast("Score non enregistré : "+msgErr(r.error))}},
  qq(){Q=null;render()},
  shr(){share("J’ai eu "+Q.sc+"/"+Q.qs.length+" en "+Q.s+" sur Entraide Étudiants. Bats mon score !")},
  shr2(){share("Rejoins-moi sur Entraide Étudiants pour réviser ensemble !")},
  async copy(){const u=location.href.split("#")[0];try{await navigator.clipboard.writeText(u);toast("Lien copié !")}catch(e){prompt("Copie ce lien :",u)}},
  async sendm(){const t=val("mi").trim();if(!t)return;const r=await sb.from("messages").insert({text:t.slice(0,500)});if(r.error)return toast(msgErr(r.error));$("#mi").value="";loadMsgs()}
};
addEventListener("hashchange",go);
addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset.v)});
addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.chg==="nick"){S.nick=e.target.value.trim().slice(0,24)||"Étudiant";saveProfile()}});
addEventListener("keydown",e=>{const a=e.target.dataset&&e.target.dataset.enter;if(e.key==="Enter"&&a&&A[a])A[a]()});
(async function(){theme();if(!window.supabase){$("#v").innerHTML='<h1>Connexion impossible</h1><p class="mu">Le service n’a pas pu se charger. Vérifie ta connexion internet et recharge la page.</p>';return}
  sb=supabase.createClient(SB_URL,SB_KEY);const s=await sb.auth.getSession();await setUser(s.data&&s.data.session?s.data.session.user:null);go()})();
</script></body></html>
